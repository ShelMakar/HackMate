services:
  db:
    image: postgres:18-alpine
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    env_file:
      - .env
    environment:
      DB_HOST: db
      DJANGO_DEBUG: "True"
    volumes:
      - static_volume:/app/hackmate/staticfiles
      - media_volume:/app/hackmate/media
    expose:
      - "8000"
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend
    restart: unless-stopped



  backend-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    env_file:
      - .env
    environment:
      DB_HOST: db
      DJANGO_DEBUG: "False"
    volumes:
      - static_volume:/app/hackmate/staticfiles
      - media_volume:/app/hackmate/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    depends_on:
      backend-dev:
        condition: service_healthy

  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - static_volume:/usr/share/nginx/html/static:ro
      - media_volume:/usr/share/nginx/html/media:ro
    depends_on:
      backend-prod:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume: